# Prometheus central: recebe as metricas via remote-write do OTel Collector
# (--web.enable-remote-write-receiver). So faz self-scrape; nao raspa os clientes
# diretamente — quem empurra e o Collector de cada cliente.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
