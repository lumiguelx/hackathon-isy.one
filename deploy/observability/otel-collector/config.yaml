# OTel Collector (borda do cliente): raspa cAdvisor + node-exporter localmente e
# empurra as metricas para o Prometheus central via remote-write. Este e o padrao
# que escala: um Collector por servidor de cliente, push para um backend unico.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets: ["cadvisor:8080"]
              labels:
                cliente: tux-burger
        - job_name: node
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
              labels:
                cliente: tux-burger

processors:
  batch: {}
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resourcedetection, batch]
      exporters: [prometheusremotewrite]
