<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isy.One Shell Automation</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --border: #1f2a37;
      --fg: #e6edf3;
      --muted: #8b97a7;
      --green: #3fb950;
      --red: #f85149;
      --accent: #2f81f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px; line-height: 1.5;
    }
    header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
    header .dot { color: var(--green); }
    .token { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    input, button {
      font-family: inherit; font-size: 13px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--panel); color: var(--fg);
      padding: 7px 10px;
    }
    input { min-width: 260px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.run { background: #15331c; border-color: #2a5a36; color: var(--green); }
    button.run:hover { background: #1b3f23; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .panel h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
      margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel .body { padding: 12px 16px; }
    .script { padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .script .name { color: var(--accent); font-weight: 600; }
    .script .desc { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
    .script .row { display: flex; gap: 8px; align-items: center; }
    .script .row input { flex: 1; min-width: 0; }
    pre {
      margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px;
      max-height: 380px; overflow: auto;
    }
    .out-ok { color: var(--green); }
    .out-err { color: var(--red); }
    .log { border-bottom: 1px dashed var(--border); padding: 8px 0; font-size: 12px; }
    .log:last-child { border-bottom: none; }
    .badge { padding: 1px 7px; border-radius: 999px; font-size: 11px; }
    .badge.sucesso { background: #15331c; color: var(--green); }
    .badge.falha { background: #3a1416; color: var(--red); }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot">●</span> Isy.One Shell Automation</h1>
    <div class="token">
      <span class="muted">X-Isy-Token</span>
      <input id="token" value="544c5787-613a-4ac2-8e61-9e6486f8d74a" />
      <button onclick="loadAll()">Conectar</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Scripts disponiveis <button onclick="loadScripts()">atualizar</button></h2>
      <div class="body" id="scripts"><div class="empty">Conecte com o token para listar.</div></div>
    </section>

    <section class="panel">
      <h2>Saida da execucao</h2>
      <div class="body"><pre id="output" class="muted">Nenhuma execucao ainda.</pre></div>
    </section>

    <section class="panel" style="grid-column: 1 / -1;">
      <h2>Historico de auditoria <button onclick="loadLogs()">atualizar</button></h2>
      <div class="body" id="logs"><div class="empty">-</div></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = () => $("token").value.trim();
    const headers = () => ({ "Content-Type": "application/json", "X-Isy-Token": token() });

    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: headers(), ...opts });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
      return body;
    }

    async function loadScripts() {
      const el = $("scripts");
      try {
        const { data } = await api("/api/v1/scripts");
        if (!data.length) { el.innerHTML = '<div class="empty">Nenhum script ativo cadastrado.</div>'; return; }
        el.innerHTML = data.map((s) => `
          <div class="script">
            <div class="name">${s.nome}</div>
            <div class="desc">${s.descricao || "-"} <span class="muted">| params: ${s.parametros || "nenhum"}</span></div>
            <div class="row">
              <input id="p-${s.id}" placeholder="parametros separados por espaco" />
              <button class="run" onclick="run(${s.id})">executar</button>
            </div>
          </div>`).join("");
      } catch (e) { el.innerHTML = `<div class="out-err">${e.message}</div>`; }
    }

    async function run(id) {
      const raw = $(`p-${id}`).value.trim();
      const parametros = raw ? raw.split(/\s+/) : [];
      const out = $("output");
      out.className = "muted"; out.textContent = "Executando...";
      try {
        const { data, message } = await api(`/api/v1/scripts/${id}/run`, {
          method: "POST", body: JSON.stringify({ parametros }),
        });
        const ok = data.status === "sucesso";
        out.className = ok ? "out-ok" : "out-err";
        out.textContent = `# ${message} (exit ${data.exit_code}, ${data.duracao_ms}ms)\n\n`
          + (data.stdout || "") + (data.stderr ? `\n[stderr]\n${data.stderr}` : "");
        loadLogs();
      } catch (e) { out.className = "out-err"; out.textContent = e.message; }
    }

    async function loadLogs() {
      const el = $("logs");
      try {
        const { data } = await api("/api/v1/logs?limit=20");
        if (!data.length) { el.innerHTML = '<div class="empty">Sem execucoes.</div>'; return; }
        el.innerHTML = data.map((l) => `
          <div class="log">
            <span class="badge ${l.status}">${l.status}</span>
            <strong>${l.script_nome}</strong>
            <span class="muted">${l.parametros || ""}</span>
            <span class="muted">| exit ${l.exit_code ?? "-"} | ${new Date(l.executado_em).toLocaleString()}</span>
          </div>`).join("");
      } catch (e) { el.innerHTML = `<div class="out-err">${e.message}</div>`; }
    }

    function loadAll() { loadScripts(); loadLogs(); }
    loadAll();
  </script>
</body>
</html>
