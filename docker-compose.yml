services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ISY_TOKEN: "544c5787-613a-4ac2-8e61-9e6486f8d74a"
      ISY_DATABASE_URL: "sqlite:////data/isyone.db"
      ISY_SCRIPTS_DIR: "/opt/isyone/scripts"
      ISY_SEED_DEMO: "true"
    volumes:
      # Scripts do host lidos em modo somente-leitura.
      - ./scripts:/opt/isyone/scripts:ro
      # Banco SQLite persistido fora do container.
      - isyone-data:/data

volumes:
  isyone-data:
